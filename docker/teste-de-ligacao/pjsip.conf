; pjsip.conf do TESTE DE LIGAÇÃO do CI (.github/workflows/telefonia.yml).
;
; A "operadora" é o sipp, rodando na mesma máquina (rede do host) na porta
; 5070. Sem autenticação nem registro: o teste mede o caminho da ligação dentro
; do produto (dialplan → Stasis → worker → AudioSocket → sessão de voz → fim),
; não a negociação com uma operadora de verdade.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[sipp-aor]
type=aor
contact=sip:127.0.0.1:5070

[sipp]
type=endpoint
transport=transport-udp
context=from-trunk
disallow=all
allow=ulaw
aors=sipp-aor
direct_media=no

[sipp-identify]
type=identify
endpoint=sipp
match=127.0.0.1
