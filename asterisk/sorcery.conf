; asterisk/sorcery.conf
;
; O tronco salvo na tela (Configurações › Trunk SIP) chega ao Asterisk pela ARI
; (configuração dinâmica — workers/voice-agent/aplicar-tronco.ts), sem editar
; arquivo nem reiniciar. A ARI só escreve em tipo de objeto mapeado num "wizard"
; gravável: sem estas linhas ela responde 403. O astdb persiste os objetos no
; volume asterisk-data, então eles sobrevivem a um reinício do Asterisk.
;
; Cada tipo lê PRIMEIRO o pjsip.conf (o que o operador escreveu à mão continua
; valendo — inclusive o tronco antigo colado do bloco da tela) e DEPOIS o astdb.
; O transporte não está aqui de propósito: ele é do servidor, fica no pjsip.conf.

[res_pjsip]
endpoint=config,pjsip.conf,criteria=type=endpoint
endpoint=astdb,pjsip/endpoint
auth=config,pjsip.conf,criteria=type=auth
auth=astdb,pjsip/auth
aor=config,pjsip.conf,criteria=type=aor
aor=astdb,pjsip/aor

[res_pjsip_endpoint_identifier_ip]
identify=config,pjsip.conf,criteria=type=identify
identify=astdb,pjsip/identify

[res_pjsip_outbound_registration]
registration=config,pjsip.conf,criteria=type=registration
registration=astdb,pjsip/registration
