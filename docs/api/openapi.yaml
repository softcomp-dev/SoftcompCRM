  # ───────────────────────────── Webhook de entrada ─────────────────────────────
  /api/v1/webhooks/in/{token}:
    post:
      tags: [Webhook de entrada]
      operationId: captarLeadPorWebhook
      summary: Criar lead (card) por webhook
      description: |
        Cria contato e lead no funil e etapa configurados na fonte (tela **Webhooks**).
        **Não usa Bearer**: quem autentica é o token do caminho, mais a assinatura
        opcional.

        **Mapeamento** (nomes sem diferença de maiúsculas; o mapa da fonte vem antes):
        - nome: `name`, `nome`, `full_name`, `fullname`
        - telefone: `phone`, `telefone`, `whatsapp`, `celular`, `phone_number`, `tel`
        - e-mail: `email`, `e-mail`, `mail`
        - `utm_*`, `gclid`, `fbclid` etc. vão para a origem; o resto (texto, número,
          booleano) vira campo personalizado. Objetos e listas aninhados são ignorados.

        **Campos reservados:** `external_id` (até 255; reenviar o mesmo id devolve o
        lead existente, sem duplicar) e `stage` (id ou nome da etapa; só avança).

        Pelo menos um de nome, telefone ou e-mail é obrigatório.

        **Assinatura** (só se a fonte tiver segredo): cabeçalho `X-Deskcomm-Signature`
        = HMAC-SHA256 em hex minúsculo do **corpo cru**, com o segredo da fonte. Sem
        prefixo.

        Limite: 60 requisições por minuto por token.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 8 }
          description: Token da fonte de webhook (copie da tela).
        - name: X-Deskcomm-Signature
          in: header
          required: false
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
          description: Obrigatório quando a fonte tem segredo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                name: { type: string }
                phone: { type: string }
                email: { type: string, format: email }
                external_id: { type: string, maxLength: 255 }
                stage: { type: string }
            example: { name: Maria Exemplo, phone: "5511900000000", email: maria@exemplo.com, external_id: "PED-12345", pedido: "12345", valor: 1500 }
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: { type: string } }
      responses:
        "200":
          description: Lead criado (ou existente, no reenvio com o mesmo `external_id`).
          headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lead_id: { type: string, format: uuid }
              example: { data: { lead_id: 6c8e0a2b-4d6f-4b8a-9c0e-2b4d6f8a0c14 } }
        "303":
          description: Envio de formulário (`x-www-form-urlencoded`) numa fonte com página de retorno configurada.
          headers: { Location: { schema: { type: string, format: uri } } }
        "400": { $ref: "#/components/responses/RequisicaoInvalida" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "422": { $ref: "#/components/responses/Validacao" }
        "429": { $ref: "#/components/responses/LimiteExcedido" }
        "500": { $ref: "#/components/responses/ErroInterno" }

  # ───────────────────────────── MCP ─────────────────────────────
  /api/mcp:
    post:
      tags: [MCP]
      operationId: chamarMcp
      summary: Servidor MCP (JSON-RPC 2.0)
      description: |
        Servidor [MCP](https://modelcontextprotocol.io) em Streamable HTTP, **sem
        sessão** (cada requisição é independente). Expõe o CRM como ferramentas
        (umas 80) — é a porta pensada para agentes de IA, e serve a qualquer
        programa que fale JSON-RPC. Para funil e cards há rotas REST equivalentes
        (`/api/v1/pipelines`, `/api/v1/leads`, `/api/v1/leads/{id}/move`), mais
        simples para um ERP.

        Envie `Accept: application/json, text/event-stream`. Métodos usuais:
        `tools/list` (lista as ferramentas com o esquema de cada uma) e `tools/call`.

        **Erros:** falha de autenticação volta como erro JSON-RPC (`-32001` com HTTP
        401; `-32004` com HTTP 429). Erro **dentro** de uma ferramenta (falta de
        escopo, papel, limite, validação) volta com **HTTP 200** e
        `result.isError: true`, com a explicação em `result.content[0].text`.

        Escopo por ferramenta: leitura exige `mcp:read`, escrita exige `mcp:write`.
        Limites: 60 chamadas/min por token, 30 escritas/min por token, 600/min por
        organização.
      x-escopos: [mcp:read, mcp:write]
      parameters:
        - name: Accept
          in: header
          required: true
          schema: { type: string, example: "application/json, text/event-stream" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonRpcRequisicao" }
            examples:
              listarFerramentas:
                summary: Listar ferramentas
                value: { jsonrpc: "2.0", id: 1, method: tools/list }
              criarCard:
                summary: Criar card no funil
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: tools/call
                  params:
                    name: crm_create_lead
                    arguments:
                      pipeline_id: 0a2c4e6f-8b0d-4f2a-9c4e-6a8c0e2a4b16
                      stage_id: 1b3d5f7a-9c1e-4a3b-8d5f-7b9d1f3a5c18
                      title: Pedido 12345 - Maria Exemplo
                      contact_id: 3f1c2a9e-1b7d-4c55-9a51-2d1b0c7e8a10
                      value_cents: 150000
                      tags: [erp]
                      source: erp
                      custom_fields: { pedido: "12345" }
              moverEtapa:
                summary: Mover card de etapa
                value:
                  jsonrpc: "2.0"
                  id: 3
                  method: tools/call
                  params:
                    name: crm_move_lead_stage
                    arguments: { lead_id: 6c8e0a2b-4d6f-4b8a-9c0e-2b4d6f8a0c14, to_stage_id: 1b3d5f7a-9c1e-4a3b-8d5f-7b9d1f3a5c18, reason: Pedido faturado no ERP }
      responses:
        "200":
          description: Resposta JSON-RPC (em JSON ou em `text/event-stream`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResposta" }
            text/event-stream:
              schema: { type: string }
        "400":
          description: "`Idempotency-Key` fora do formato UUID (JSON-RPC `-32602`)."
          content: { application/json: { schema: { $ref: "#/components/schemas/JsonRpcResposta" } } }
        "401":
          description: Token ausente, inválido, revogado ou expirado (JSON-RPC `-32001`).
          content: { application/json: { schema: { $ref: "#/components/schemas/JsonRpcResposta" } } }
        "429":
          description: Muitas falhas de autenticação (JSON-RPC `-32004`).
          content: { application/json: { schema: { $ref: "#/components/schemas/JsonRpcResposta" } } }
        "500":
          description: Erro interno (JSON-RPC `-32603`).
          content: { application/json: { schema: { $ref: "#/components/schemas/JsonRpcResposta" } } }

components:
  securitySchemes:
    bearerDsk:
      type: http
      scheme: bearer
      bearerFormat: "dsk_…"
      description: Token de **Configurações › API Tokens**. Os escopos de cada operação estão em `x-escopos`.

  headers:
    XRequestId:
      description: Identificador da requisição, o mesmo do registro e da auditoria.
      schema: { type: string }
    RetryAfter:
      description: Segundos até poder tentar de novo.
      schema: { type: integer, example: 60 }

  parameters:
    IdUuid:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VidUuid:
      name: vid
      in: path
      required: true
      description: Id da versão.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        UUID gerado por você. Repetir a mesma chave com o mesmo corpo em até 24 h
        devolve a resposta original sem repetir o efeito; com corpo diferente, 409.
      schema: { type: string, format: uuid }

  responses:
    RequisicaoInvalida:
      description: Requisição malformada (`invalid_request`, `body_malformed`, `validation_error`).
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" }, example: { error: { code: invalid_request, message: Body JSON inválido. } } } }
    CorpoMalformado:
      description: JSON ilegível (`body_malformed`) ou `Idempotency-Key` fora do formato UUID.
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" }, example: { error: { code: body_malformed, message: JSON inválido. } } } }
    CursorInvalido:
      description: Cursor de paginação inválido (`invalid_cursor`).
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    NaoAutenticado:
      description: Token ausente, com formato errado, desconhecido, revogado ou expirado (`unauthenticated`).
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" }, example: { error: { code: unauthenticated, message: Token not recognized. } } } }
    Proibido:
      description: |
        `forbidden_role` (falta escopo ou papel no token), `org_suspended` (conta
        suspensa) ou `forbidden` (regra de negócio, como contato pessoal ou bloqueado).
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" }, example: { error: { code: forbidden_role, message: "Token missing required scope 'mcp:write'." } } } }
    NaoEncontrado:
      description: Recurso inexistente **nesta organização** (`not_found` ou código específico).
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" }, example: { error: { code: not_found, message: Conversa não encontrada. } } } }
    Conflito:
      description: Estado não permite a operação (`conflict`, `state_conflict`, nome repetido etc.).
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    ConflitoDeIdempotencia:
      description: "`idempotency_conflict` (mesma chave, corpo diferente) ou `idempotency_in_progress`."
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    Validacao:
      description: Campos inválidos (`validation_failed` ou `validation_error`), com detalhes por campo quando disponíveis.
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
          example: { error: { code: validation_error, message: Dados inválidos., details: { fieldErrors: { conversation_id: ["Invalid uuid"] } } } }
    MuitoGrande:
      description: Arquivo acima de 50 MB (`payload_too_large`).
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    TipoNaoSuportado:
      description: Tipo de arquivo não aceito (`unsupported_media_type`).
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }
    LimiteExcedido:
      description: Teto de requisições (`rate_limited`). Espere o `Retry-After`.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" }, example: { error: { code: rate_limited, message: Too many requests. } } } }
    ErroInterno:
      description: Falha do servidor (`internal_error` ou código específico).
      headers: { X-Request-Id: { $ref: "#/components/headers/XRequestId" } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Erro" } } }

  schemas:
    Erro:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}

    MetaCursor:
      type: object
      properties:
        cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    RespostaComId:
      type: object
      properties:
        data:
          type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }

    Contato:
      type: object
      additionalProperties: true
      required: [id, organization_id]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        display_name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        phone_number: { type: [string, "null"] }
        additional_phones: { type: [array, "null"], items: {} }
        zip_code: { type: [string, "null"] }
        street: { type: [string, "null"] }
        number: { type: [string, "null"] }
        complement: { type: [string, "null"] }
        district: { type: [string, "null"] }
        city: { type: [string, "null"] }
        state: { type: [string, "null"] }
        cpf_available: { type: boolean, description: O CPF em si nunca sai. }
        birthdate: { type: [string, "null"], format: date }
        is_blocked: { type: boolean }
        blocked_reason: { type: [string, "null"] }
        is_personal: { type: boolean }
        ai_opt_out: { type: boolean }
        is_anonymized: { type: boolean }
        tags: { type: array, items: { type: string } }
        source: { type: [string, "null"] }
        source_metadata: { type: [object, "null"], additionalProperties: true }
        custom_fields: { type: [object, "null"], additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_activity_at: { type: [string, "null"], format: date-time }
        conversa:
          type: [object, "null"]
          properties:
            id: { type: string, format: uuid }
            preview: { type: [string, "null"] }
            last_message_at: { type: [string, "null"], format: date-time }
            unread: { type: [integer, boolean] }

    EnvioDeMensagem:
      type: object
      required: [conversation_id]
      description: Exige `body`, `media_url` ou `media_storage_path` (exceto `contact`, que usa `metadata`).
      properties:
        conversation_id: { type: string, format: uuid }
        type: { type: string, enum: [text, image, audio, document, sticker, video, location, contact, template], default: text }
        body: { type: string, minLength: 1, maxLength: 4096 }
